name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --no-restore

  smoke-test:
    name: Published artifact smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish src/LlmGateway.Api -c Release -o /tmp/app -p:UseAppHost=false

      - name: Run and probe
        run: |
          cd /tmp/app
          ASPNETCORE_ENVIRONMENT=Development \
          Tenancy__DevApiKey=ci-smoke-key \
          ASPNETCORE_URLS=http://127.0.0.1:5210 \
          dotnet LlmGateway.Api.dll &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:5210/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:5210/healthz
          curl -sf -o /dev/null -w "%{http_code}\n" http://127.0.0.1:5210/v1/chat/completions \
            -H "Authorization: Bearer ci-smoke-key" \
            -H "Content-Type: application/json" \
            -d '{"model":"demo-model","messages":[{"role":"user","content":"ci smoke test"}]}'

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build hardened image
        run: docker build -f deploy/Containerfile -t llm-gateway:ci .
